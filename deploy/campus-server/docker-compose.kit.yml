# Offline install kit overlay (deploy/campus-server). Applied after
# docker-compose.yml and docker-compose.pilot.yml on a host installed from
# the kit: every image comes from the kit (docker load), nothing is built or
# pulled. Digest-pinned third-party images are re-tagged by the packager
# (scripts/package-campus-server.sh) because `docker load` does not restore
# repository digests.

x-kit: &kit
  build: !reset null
  pull_policy: never

services:
  nginx:
    pull_policy: never
  frontend:
    <<: *kit
  backend:
    <<: *kit
    # Web "System update" page (ACR-OPS-01). Backend only: token-free state
    # written by root (read-only) and the inbox for signed requests.
    volumes:
      - ./update-state:/var/lib/smart-campus/update-state:ro
      - ./update-requests:/var/lib/smart-campus/update-requests
  queue:
    <<: *kit
  scheduler:
    <<: *kit
  websocket:
    <<: *kit
  ai-service:
    <<: *kit
    image: smart-campus/ai-service:pilot
  postgres:
    pull_policy: never
  redis:
    pull_policy: never
  objectstore:
    image: smart-campus/vendor-seaweedfs:kit
    pull_policy: never
  objectstore-init:
    image: smart-campus/vendor-seaweedfs:kit
    pull_policy: never
    # One-shot: install.sh runs it with `dc run`. Kept out of `up` because
    # `up --wait` treats its normal exit (0) as a failure.
    profiles: ["setup"]
  storage-migrate:
    image: smart-campus/vendor-rclone:kit
    pull_policy: never
  clamav:
    image: smart-campus/vendor-clamav:kit
    pull_policy: never
  db-roles:
    pull_policy: never
