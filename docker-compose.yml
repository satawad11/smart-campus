# AI Smart Campus — base development compose (FND-002)
#
# Defines the initial service topology from docs/04-development-blueprint.md §3:
#   nginx, frontend, backend, queue, scheduler, websocket, ai-service,
#   postgres, redis, minio
# plus named volumes and ONE internal application network.
#
# Scope note (FND-002): this file wires the base services only. Application
# Dockerfiles/code arrive in FND-003 (backend), FND-004 (frontend), and
# FND-005 (ai-service); Nginx routing config in FND-009. No production secrets
# are hardcoded — all credentials/ports come from environment variables with
# dev-safe defaults (see .env.example). Copy .env.example to .env for local use.

name: smart-campus

# Shared build definition for the Laravel backend image. The queue, scheduler,
# and websocket workers all run the same image with a different command.
x-backend: &backend
  build:
    context: ./apps/backend        # Dockerfile added in FND-003
  image: smart-campus/backend:dev
  # The backend .env is excluded from the image (.dockerignore), so every backend
  # process — php-fpm, queue, scheduler, websocket — must receive it here.
  # Without it queue/scheduler fall back to the sqlite default and crash (PILOT-001).
  env_file:
    - path: ${BACKEND_ENV_FILE:-./apps/backend/.env}
      required: false
  # Persistent Laravel storage shared by all backend processes. Backups
  # (storage/app/backups), local-disk files and logs previously lived in the
  # container's writable layer and were lost on every recreate (PILOT-003).
  # Production must still copy backups off-host (PILOT-001 H9).
  volumes:
    - backend-storage:/var/www/html/storage
  networks: [smartcampus]
  restart: unless-stopped

networks:
  # Single internal application network.
  smartcampus:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-storage:

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      # Development routing config (FND-009): frontend + Laravel API gateway.
      - ./infrastructure/nginx:/etc/nginx/conf.d:ro
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./apps/frontend     # Dockerfile + Vue app added in FND-004
    image: smart-campus/frontend:dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "5173"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend                   # Laravel php-fpm; app added in FND-003
    depends_on:
      - postgres
      - redis
      - minio
    expose:
      - "9000"
    healthcheck:
      # php-fpm speaks FastCGI, not HTTP — check the port is accepting connections.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work"]
    depends_on:
      - backend
      - redis

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - backend

  websocket:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      - backend
      - redis
    ports:
      - "${REVERB_PORT:-8080}:8080"

  ai-service:
    build:
      context: ./apps/ai-service   # Dockerfile + FastAPI app added in FND-005
    image: smart-campus/ai-service:dev
    environment:
      AI_MODE: ${AI_MODE:-mock}
    expose:
      - "8001"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    # pgvector-capable image (locked data stack: PostgreSQL + pgvector).
    # The init script enables the vector and pg_trgm extensions on first init.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_campus}
      POSTGRES_USER: ${POSTGRES_USER:-smart_campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_campus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Deterministic extension setup (FND-006), runs on first initialization.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_campus} -d ${POSTGRES_DB:-smart_campus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Dev persistence: append-only file so cache/queue/session survive restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pinned (2026-10-14) to the image already in use (built 2025-09-07) instead of
    # `latest`; MinIO is AGPL-3.0, see docs/commercial/DEPENDENCY_LICENSES.md.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
