# AI Smart Campus — base development compose (FND-002)
#
# Defines the initial service topology from docs/04-development-blueprint.md §3:
#   nginx, frontend, backend, queue, scheduler, websocket, ai-service,
#   postgres, redis, objectstore (S3-compatible, SeaweedFS)
# plus named volumes and ONE internal application network.
#
# Scope note (FND-002): this file wires the base services only. Application
# Dockerfiles/code arrive in FND-003 (backend), FND-004 (frontend), and
# FND-005 (ai-service); Nginx routing config in FND-009. No production secrets
# are hardcoded — all credentials/ports come from environment variables with
# dev-safe defaults (see .env.example). Copy .env.example to .env for local use.

name: smart-campus

# Shared build definition for the Laravel backend image. The queue, scheduler,
# and websocket workers all run the same image with a different command.
x-backend: &backend
  build:
    context: ./apps/backend        # Dockerfile added in FND-003
  image: smart-campus/backend:dev
  # The backend .env is excluded from the image (.dockerignore), so every backend
  # process — php-fpm, queue, scheduler, websocket — must receive it here.
  # Without it queue/scheduler fall back to the sqlite default and crash (PILOT-001).
  env_file:
    - path: ${BACKEND_ENV_FILE:-./apps/backend/.env}
      required: false
  # Persistent Laravel storage shared by all backend processes. Backups
  # (storage/app/backups), local-disk files and logs previously lived in the
  # container's writable layer and were lost on every recreate (PILOT-003).
  # Production must still copy backups off-host (PILOT-001 H9).
  volumes:
    - backend-storage:/var/www/html/storage
  networks: [smartcampus]
  restart: unless-stopped

networks:
  # Single internal application network.
  smartcampus:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  backend-storage:

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      # Development routing config (FND-009): frontend + Laravel API gateway.
      - ./infrastructure/nginx:/etc/nginx/conf.d:ro
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./apps/frontend     # Dockerfile + Vue app added in FND-004
    image: smart-campus/frontend:dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Public Reverb app key for the browser's realtime client (Live Monitor).
      # Must equal REVERB_APP_KEY in apps/backend/.env; without it there is no
      # live event feed.
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-}
    expose:
      - "5173"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend                   # Laravel php-fpm; app added in FND-003
    depends_on:
      - postgres
      - redis
      - objectstore
    expose:
      - "9000"
    healthcheck:
      # php-fpm speaks FastCGI, not HTTP — check the port is accepting connections.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1',9000)?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work"]
    depends_on:
      - backend
      - redis

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - backend

  websocket:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      - backend
      - redis
    ports:
      - "${REVERB_PORT:-8080}:8080"

  ai-service:
    build:
      context: ./apps/ai-service   # Dockerfile + FastAPI app added in FND-005
    image: smart-campus/ai-service:dev
    environment:
      AI_MODE: ${AI_MODE:-onnx}
    expose:
      - "8001"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      # Liveness alone can be green while the ONNX files are absent. Production
      # recognition must not be reported healthy until all three providers load.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    # pgvector-capable image (locked data stack: PostgreSQL + pgvector).
    # The init script enables the vector and pg_trgm extensions on first init.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_campus}
      POSTGRES_USER: ${POSTGRES_USER:-smart_campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_campus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Deterministic extension setup (FND-006), runs on first initialization.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_campus} -d ${POSTGRES_DB:-smart_campus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Dev persistence: append-only file so cache/queue/session survive restarts.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  objectstore:
    # S3-compatible object storage: SeaweedFS (Apache-2.0), replacing MinIO,
    # whose images are no longer published (2026-11). Pinned by digest.
    # Identities are generated from the environment by start.sh: a root
    # (admin) identity and a least-privilege app identity limited to the
    # buckets in buckets.txt. Defaults below are for development only.
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    entrypoint: ["/bin/sh", "/objectstore/start.sh"]
    environment:
      OBJECTSTORE_ROOT_USER: ${OBJECTSTORE_ROOT_USER:-campus-root}
      OBJECTSTORE_ROOT_PASSWORD: ${OBJECTSTORE_ROOT_PASSWORD:-campus-dev-root-secret}
      OBJECTSTORE_APP_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-campus-dev-app}
      OBJECTSTORE_APP_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-campus-dev-app-secret}
    volumes:
      - objectstore-data:/data
      - ./infrastructure/objectstore:/objectstore:ro
    ports:
      - "${OBJECTSTORE_PORT:-8333}:8333"
    networks: [smartcampus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  objectstore-init:
    # One-shot, idempotent: creates the buckets in buckets.txt.
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    entrypoint: ["/bin/sh", "/objectstore/init.sh"]
    depends_on:
      objectstore:
        condition: service_healthy
    volumes:
      - ./infrastructure/objectstore:/objectstore:ro
    networks: [smartcampus]
    restart: "no"
