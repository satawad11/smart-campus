name: CI

# Base CI pipeline (FND-011). Runs backend/frontend/AI checks, a dependency
# scan, and Docker build validation on every push and pull request.
# No deployment (CD is out of scope).

on:
  push:
    branches: ["**"]
  pull_request:
  # Reused by release.yml: a release is built only after this whole pipeline passes.
  workflow_call:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, pdo_sqlite, mbstring, bcmath, zip, redis
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint / format (Pint)
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  backend-pgsql:
    # SQLite can't observe PostgreSQL-only behaviour (native uuid columns,
    # enum CHECK constraints, pgvector, pg_trgm). Production runs PostgreSQL.
    # Local equivalent: scripts/test-backend-pgsql.sh
    name: Backend (Laravel, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testing -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: testing
      DB_PASSWORD: testing
      DB_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, pdo_sqlite, mbstring, bcmath, zip, redis, sodium
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Tests
        run: pytest -q

  security-scan:
    name: Dependency / security scan
    runs-on: ubuntu-latest
    # Advisory only — must not block merges on transitive advisories.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: composer audit
        working-directory: apps/backend
        run: |
          composer install --no-interaction --no-progress
          composer audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit
        working-directory: apps/frontend
        run: |
          npm ci
          npm audit --audit-level=high

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config
      - name: Build images
        run: docker compose build backend frontend ai-service
