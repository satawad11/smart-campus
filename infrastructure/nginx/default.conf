# Smart Campus — development gateway (FND-009)
#
# Single public entrypoint that routes to the frontend and the Laravel API.
# The AI service is INTERNAL ONLY and is intentionally NOT exposed here
# (PROJECT_RULES.md §5 boundary; service-to-service uses /internal/v1). Device
# routing (/device/v1) and production TLS are out of scope for this task.
#
# Upstreams are referenced through variables + the Docker embedded DNS resolver
# so the config loads even when a target service is temporarily down, and
# resolution happens per-request.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # --- Gateway self-health (FND-010): 200 without touching upstreams.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Laravel API (public/admin). Contract prefix: /api/v1 (PROJECT_RULES §6).
    location /api/ {
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        # Laravel front controller lives in the php-fpm container's filesystem.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --- Reserved: realtime websocket (Laravel Reverb), enabled in Module 05.
    # location /reverb/ {
    #     set $reverb websocket:8080;
    #     proxy_pass http://$reverb;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }

    # --- Frontend (Vite dev server, including HMR websocket).
    location / {
        set $frontend frontend:5173;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
