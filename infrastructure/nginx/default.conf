# Smart Campus — development gateway (FND-009)
#
# Single public entrypoint that routes to the frontend and the Laravel API.
# The Python AI service (apps/ai-service) is INTERNAL ONLY and is
# intentionally NOT exposed here (PROJECT_RULES.md §5 boundary) — it is
# reached only service-to-service, never through this gateway. That is a
# different thing from PROJECT_RULES.md §6's `/internal/v1` prefix, which IS
# routed below: that's the Laravel backend's own machine-to-machine surface
# (AI-node bearer-credential auth, CAM-003/004; recognition-event ingestion,
# EVT-003) — physical AI-node hardware reaches it through this same public
# gateway, the same as any other client. Device routing (/device/v1) and
# production TLS are out of scope for this task.
#
# Upstreams are referenced through variables + the Docker embedded DNS resolver
# so the config loads even when a target service is temporarily down, and
# resolution happens per-request.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # --- Gateway self-health (FND-010): 200 without touching upstreams.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- Backend health probes (FND-010 routes in routes/web.php), used by the
    # deployment runbook and pilot:preflight smoke checks. Without this block
    # they fell through to the SPA and answered 200 HTML (PILOT-005).
    location ~ ^/health(/(database|redis|storage|ai|full))?$ {
        access_log off;
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --- Laravel API (public/admin). Contract prefix: /api/v1 (PROJECT_RULES §6).
    location /api/ {
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        # Laravel front controller lives in the php-fpm container's filesystem.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --- Laravel internal/machine API (PROJECT_RULES.md §6 prefix
    # /internal/v1). Same backend upstream as /api/, no auth cookies/CSRF
    # involved — auth is the per-node bearer credential (ai_node.token
    # middleware), applied per-route inside the app itself.
    location /internal/ {
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --- Realtime WebSocket (Laravel Reverb, EVT-013). The browser connects
    # to this same origin (single public entrypoint), not a separate
    # host:port — `websocket:8080` is an internal Docker hostname only
    # reachable inside the compose network. Reverb itself knows nothing
    # about this gateway path (it expects requests at its own root, e.g.
    # /app/{key}), so the /reverb/ prefix must be stripped before
    # forwarding. A trailing slash on proxy_pass normally does that
    # automatically, but NOT when proxy_pass's target is a variable (as it
    # must be here, for the resolver-based dynamic DNS lookup this file's
    # own top comment describes) — with a variable, nginx passes the
    # original URI through unchanged regardless of the trailing slash, so
    # the rewrite below strips the prefix explicitly instead. The frontend
    # Echo client (src/services/echo.js) is configured with a matching
    # wsPath: '/reverb'.
    location /reverb/ {
        set $reverb websocket:8080;
        rewrite ^/reverb/(.*)$ /$1 break;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Frontend (Vite dev server, including HMR websocket).
    location / {
        set $frontend frontend:5173;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
