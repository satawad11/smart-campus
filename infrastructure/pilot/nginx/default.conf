# Smart Campus — PILOT gateway (TLS). Used by docker-compose.pilot.yml.
#
# Same routing as infrastructure/nginx/default.conf (development), plus:
#   - HTTP :80 redirects to HTTPS (except the gateway self-check /healthz)
#   - HTTPS :443 with the certificate from infrastructure/pilot/certs/
#   - HTTPS=on passed to PHP so Laravel issues Secure cookies and HSTS
#   - the frontend upstream is the static production image (Dockerfile.prod)
# Keep the location blocks in sync with the development gateway.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend health probes (FND-010) — JSON from Laravel, never the SPA.
    location ~ ^/health(/(database|redis|storage|ai|full))?$ {
        access_log off;
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }

    location /api/ {
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }

    # AI-node machine API (bearer credential auth inside the app).
    location /internal/ {
        set $backend_fpm backend:9000;
        include fastcgi_params;
        fastcgi_pass $backend_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }

    # Reverb WebSocket (wss://<host>/reverb/...), prefix stripped as in dev.
    location /reverb/ {
        set $reverb websocket:8080;
        rewrite ^/reverb/(.*)$ /$1 break;
        proxy_pass http://$reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Static production frontend (nginx inside the frontend image).
    location / {
        set $frontend frontend:5173;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
