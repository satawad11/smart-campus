openapi: 3.1.0
info:
  title: AI Smart Campus Security & Access Platform API
  version: 0.1.0
servers:
  - url: /api/v1
paths: {}
components:
  schemas:
    ApiSuccess:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta: {}
    ApiError:
      type: object
      required: [success, message, error]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
            fields:
              type: object
